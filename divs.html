<!DOCTYPE html>
<html> <head>
	<title>
		Conrad Sorge Divs
	</title> 
	<style>
    .flex-container {
      display: flex;  flex-direction:row;
      background-color: red;
  }

.flex-container > div {  /*div children of the flex container*/
  background-color: #f1f1f1; 
  margin: 10px;  padding: 20px;  font-size: 30px;
}

/* Responsive layout */
@media (max-width: 600px) { 
	 .flex-container{
		 flex-direction:column;
		 background-color: green;
	  }
	}
</style></head>



<body>
	<h1>
		Conrad Sorge Builds Lists With Divs
	</h1>
	<input type = "text" id = "inputText">
		<div class="flex-container" id="target">
		  <div class = "divList">row item 1</div>   
		  <div class = "divList">row item 2</div>  
		  <div class = "divList">row item 3</div>  
		</div>
	
	<p> Press the button to add a new element to the end
		</p>
		<button onclick="makeNewDiv()">Add end</button>
	<p>
		press the button to add a new element to the front
	</p>
	<button onclick = "addFront()">
		Add Front
	</button>
	<p>
		remove a element
	</p>
	<button onclick = "removeItem()">
		Remove
	</button>
	
</body>
<script>
	function makeNewDiv(){
		/* make the div and its text */
		let element = document.createElement("div")
		let value = document.getElementById("inputText").value
		element.innerHTML = value
		element.className = "divList"

		/* add it to the container */
		let container = document.getElementById('target')
		container.appendChild(element)
		
	}
	function addFront(){
		let element = document.createElement("div")
		let value = document.getElementById("inputText").value
		element.innerHTML = value
		element.className = "divList"
		let container = document.getElementById('target')
		container.insertBefore(element, container.firstChild)
	}
	function removeItem(){
		let divListItems = document.getElementsByClassName("divList")
		let length = divListItems.length
		if (length > 1){
			divListItems[1].remove()
		}
		else if (length == 1){
			divListItems[0].remove()
		}
	}
</script>
</html>
